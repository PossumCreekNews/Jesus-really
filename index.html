<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061522"><title>Jesus, Really?!</title><link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#061522;color:white;font-family:Inter,Arial}#app{max-width:470px;margin:auto;min-height:100dvh;background:linear-gradient(150deg,#04111b,#0a2735);padding-bottom:90px}button,textarea{font:inherit}button{cursor:pointer}.page{padding:22px}.logo{font:32px/.98 'Permanent Marker',Impact;transform:rotate(-5deg);display:inline-block}.logo.big{font-size:clamp(65px,16vw,90px)}.yellow{color:#ffcd1b}.btn{background:#ffcd21;color:#07131b;border:0;border-radius:40px;padding:16px 22px;font-weight:900;font-size:18px;width:100%}.welcome{min-height:100dvh;padding:55px 25px 35px;text-align:center;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(#041522aa,#04152230 45%,#041522 94%),url('https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=900') center/cover}.swoosh{height:7px;width:80%;margin:16px auto 28px;background:#ffcd21;border-radius:50%;transform:rotate(-5deg)}.features{display:flex;justify-content:space-between;font-size:12px;margin:28px 0}.features b{display:block;color:#ffcd21;font-size:27px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.top button{border:0;background:transparent;color:white;font-size:25px}.card{border:1px solid #4f7184;background:#0c2a3a;border-radius:15px;padding:16px;margin:15px 0}.feature{min-height:280px;background:linear-gradient(90deg,#051521dd,#05152140),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900') center/cover;display:flex;flex-direction:column;justify-content:space-between}.feature h2{max-width:285px;line-height:1.16}.feature .btn{width:auto}.pill{border:1px solid #9fb5c0;border-radius:30px;padding:6px 12px;font-weight:800;font-size:13px;display:inline-block}.bar{height:9px;border-radius:9px;background:#536f7e;overflow:hidden}.bar div{height:100%;background:#ffcd21}.quick{display:block;width:100%;text-align:left;color:white;background:#102d3b;border:1px solid #55788a;border-radius:12px;padding:14px;margin:7px 0}.muted{color:#bfd0d9}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:470px;width:100%;background:#03111cf5;border-top:1px solid #476b7b;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 0 max(14px,env(safe-area-inset-bottom))}.nav button{border:0;background:none;color:white;font-size:12px}.nav .active{color:#ffcd21}.nav i{display:block;font-size:25px;font-style:normal}.steps{display:flex;gap:7px;margin:22px 0}.steps span{flex:1;height:9px;border-radius:9px;background:#536f7e}.steps .on{background:#ffcd21}.lesson h1{font-size:30px;line-height:1.15}.lesson p{font-size:17px;line-height:1.5}.photo{height:240px;margin:0 -22px 20px;background:linear-gradient(0deg,#061522,transparent),url('https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=900') center/cover}.choice{width:100%;padding:15px;text-align:left;border:1px solid #66899a;border-radius:30px;background:#112e3d;color:white;margin:6px 0}.choice.selected{background:#ffcd21;color:#061522;font-weight:800}.tag{color:#ffcd21;font-size:13px;font-weight:900;letter-spacing:1px}.entry{width:100%;min-height:160px;background:#102c3b;color:white;border:1px solid #66899a;border-radius:12px;padding:13px}.days{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.days span{text-align:center;border:1px solid #547486;border-radius:10px;padding:13px 0}.days span:first-child{color:#ffcd21;border-color:#ffcd21}
</style></head><body><main id="app"></main><script>
const k='jr-prototype-v1';let d=JSON.parse(localStorage.getItem(k)||'{}');let tab='Home',step=0;const a=document.getElementById('app');function save(){localStorage.setItem(k,JSON.stringify(d))}function go(t){tab=t;render()}function lesson(n){step=n;go('Lesson')}function choose(n){d.answer=n;save();render()}function done(){d.complete=true;save();go('Home')}function store(t){d[t]=document.querySelector('textarea').value;save();document.getElementById('saved').textContent='Saved on this device ✓'}const logo=(big=false)=>'<div class="logo '+(big?'big':'')+'">JESUS,<br>REALLY<span class="yellow">?!</span></div>';const btn=(label,action)=>'<button class="btn" onclick="'+action+'">'+label+'</button>';const nav=()=>'<nav class="nav">'+[['Home','⌂'],['Journey','▦'],['Journal','▤'],['Pray','♧']].map(([n,i])=>'<button class="'+(tab===n?'active':'')+'" onclick="go(\''+n+'\')"><i>'+i+'</i>'+n+'</button>').join('')+'</nav>';function render(){if(!d.started){a.innerHTML='<section class="welcome"><div>'+logo(true)+'<div class="swoosh"></div><h3>30 DAYS TO DISCOVER<br>THE JESUS YOU<br>NEVER KNEW.</h3></div><div>'+btn('Start the Journey →','d.started=true;save();go(\'Home\')')+'<div class="features"><div><b>ϟ</b>Real<br>Stories</div><div><b>☏</b>Big<br>Questions</div><div><b>▣</b>Real<br>Answers</div><div><b>◎</b>A Closer<br>Jesus</div></div><p style="font-family:Permanent Marker">Not about religion.<br>It’s about a real relationship.</p><div class="swoosh"></div></div></section>';return}
if(tab==='Home'){a.innerHTML='<section class="page"><div class="top"><button onclick="go(\'Journey\')">☰</button>'+logo()+'<button onclick="go(\'Journal\')">◉</button></div><h2>Your 30-Day Journey</h2><div class="card feature"><span class="pill">DAY 1 OF 30</span><div><h2>What If Everything You’ve Been Told About Jesus Isn’t Quite Right?</h2>'+btn(d.complete?'Read Day 1 Again →':'Start Day 1 →','lesson(0)')+'</div></div><div class="card"><b>Your Progress</b><p>'+(d.complete?1:0)+' of 30 days</p><div class="bar"><div style="width:'+(d.complete?3.33:0)+'%"></div></div></div>'+[['Journey','My Journey','See all 30 days'],['Journal','My Journal','Your thoughts, prayers, and wins'],['Pray','Pray','A simple way to talk to Jesus']].map(x=>'<button class="quick" onclick="go(\''+x[0]+'\')"><b>'+x[1]+' →</b><br><small class="muted">'+x[2]+'</small></button>').join('')+'</section>'+nav();return}
if(tab==='Lesson'){let body='';if(step===0)body='<div class="photo"></div><h1>What If Everything You’ve Been Told About Jesus Isn’t Quite Right?</h1><p>For a lot of us, Jesus has been packaged, preached, and explained so many different ways that it’s hard to know what’s real. Today, we’re cutting through the noise and meeting Jesus for who He really is.</p>'+btn('Continue →','lesson(1)');if(step===1)body='<div class="tag">YOUR TURN</div><h1>When you hear the name “Jesus,” what’s the first thing that comes to mind?</h1>'+['A religious figure','A good person','A life-changer','Not sure','I’ve got questions','Other'].map((x,i)=>'<button class="choice '+(d.answer===i?'selected':'')+'" onclick="choose('+i+')">'+(d.answer===i?'✓ ':'◯ ')+x+'</button>').join('')+'<p></p>'+btn('Next →','lesson(2)');if(step===2)body='<div class="tag">THE STORY</div><h1>Wait… Jesus Ate With Who?!</h1><p>Jesus got criticized for the people He spent time with. In Mark 2:13–17, He invited Levi, a tax collector, to follow Him. Then He shared a meal with people religious leaders looked down on.</p><div class="card"><b>READ IT FOR YOURSELF</b><p>Mark 2:13–17</p><p class="muted">Jesus explained that He came for people who needed help—not those pretending they had it all figured out.</p><small>This is a summary, not a direct quotation. Read the passage in your Bible or Bible app.</small></div>'+btn('Keep Going →','lesson(3)');if(step===3)body='<div class="tag">MAKE IT PERSONAL</div><h1>What if you didn’t have to get everything right first?</h1><p>Jesus didn’t wait for people to clean up their reputations before spending time with them.</p><p>What might change if you believed He was willing to meet you where you are?</p>'+btn('Let’s Talk →','lesson(4)');if(step===4)body='<div class="tag">ONE SMALL STEP</div><h1>Never prayed before? That’s okay.</h1><p>Prayer is simply talking to Jesus. No special voice or perfect words required.</p><div class="card"><p>“Jesus, I’m not sure what I believe yet, but I’m curious. Help me see who You really are. Show me where to start. Amen.”</p></div><p>Try saying that quietly or in your own words.</p>'+btn('Finish Day 1 ✓','done()');a.innerHTML='<section class="page lesson"><div class="top"><button onclick="'+(step?'lesson('+(step-1)+')':"go('Home')")+'">‹</button><span class="pill">DAY 1 OF 30</span><span>•••</span></div><div class="steps">'+[0,1,2,3,4].map(i=>'<span class="'+(i<=step?'on':'')+'"></span>').join('')+'</div>'+body+'</section>'+nav();return}
if(tab==='Journey'){a.innerHTML='<section class="page"><h1>Your 30-Day Journey</h1><div class="card"><h2>'+(d.complete?1:0)+' / 30 days</h2><div class="bar"><div style="width:'+(d.complete?3.33:0)+'%"></div></div></div><p class="muted">A little time each day. A chance to get to know Jesus for yourself.</p><div class="days">'+Array.from({length:30},(_,i)=>'<span>'+(i+1)+(i===0&&d.complete?' ✓':'')+'</span>').join('')+'</div><p class="muted">Only Day 1 is unlocked in this prototype.</p>'+btn('Open Day 1 →','lesson(0)')+'</section>'+nav();return}
if(tab==='Journal'||tab==='Pray'){let j=tab==='Journal',f=j?'journal':'prayer';a.innerHTML='<section class="page"><div class="tag">'+(j?'YOUR THOUGHTS':'YOUR CONVERSATION')+'</div><h1>'+(j?'My Journal':'Talk to Jesus')+'</h1><p class="muted">'+(j?'No perfect answers. Be honest, curious, or even confused.':'You can talk to Jesus like someone who wants to hear from you. No special script.')+'</p><div class="card"><b>'+(j?'What stood out to you today?':'What’s on your mind today?')+'</b><p class="muted">Write whatever comes to mind.</p><textarea class="entry" placeholder="Start here…"></textarea><p></p>'+btn(j?'Save Journal Entry':'Save My Prayer',"store('"+f+"')")+'<p id="saved" class="yellow"></p></div></section>'+nav();document.querySelector('textarea').value=d[f]||'';return}}render();
</script></body></html>
